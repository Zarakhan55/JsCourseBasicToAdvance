
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <div class="card">

            <div class="text">
                <img src="https://plus.unsplash.com/premium_photo-1677158265072-5d15db9e23b2?w=300&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="Wireless Headphones">

                <h2>Wireless Headphones</h2>

                <p>Price: Rs. 2,500</p>
            </div>

            <div class="price">
                <button class="btn-cart" id="addCart">
                    Add to Cart
                </button>
            </div>

            <div class="cart-info">
                <h3>Cart Quantity: <span id="quantity">0</span></h3>

                <h3>Total Price: Rs. <span id="total">0</span></h3>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
